<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid slice" role="img" aria-label="E-Mobilität">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0E5C4D"/>
      <stop offset="100%" stop-color="#2E8B7B"/>
    </linearGradient>
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.08"/>
    </pattern>
  </defs>
  <rect width="1280" height="720" fill="url(#g)"/>
  <rect width="1280" height="720" fill="url(#dots)"/>
  <g transform="translate(880, 240)" opacity="0.92">
    
  <!-- Stylized car silhouette -->
  <rect x="-160" y="-30" width="320" height="80" rx="20" fill="#ffffff" fill-opacity="0.18"/>
  <path d="M -130 -30 L -90 -90 L 90 -90 L 130 -30 Z" fill="#ffffff" fill-opacity="0.25"/>
  <circle cx="-90" cy="55" r="28" fill="#1a1a1a"/>
  <circle cx="-90" cy="55" r="14" fill="#ffffff" fill-opacity="0.7"/>
  <circle cx="90" cy="55" r="28" fill="#1a1a1a"/>
  <circle cx="90" cy="55" r="14" fill="#ffffff" fill-opacity="0.7"/>
  <!-- Charging plug -->
  <path d="M 160 -10 L 200 -10 L 200 30 L 160 30 Z" fill="#ffffff"/>
  <path d="M 200 0 L 220 0 L 220 20 L 200 20" fill="none" stroke="#ffffff" stroke-width="6"/>
  <!-- Lightning bolt -->
  <path d="M 0 -20 L -20 20 L 0 20 L -10 50 L 20 0 L 0 0 Z" fill="#FFD200"/>

  </g>
  <g transform="translate(80, 460)">
    <rect x="-8" y="-44" width="6" height="120" fill="#E2001A"/>
    <text x="20" y="0" font-family="Helvetica, Arial, sans-serif" font-size="56" font-weight="700" fill="#ffffff">E-Mobilität</text>
    <text x="20" y="46" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#ffffff" fill-opacity="0.85">Laden Sie zu Hause und unterwegs</text>
  </g>
  <text x="1240" y="690" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#ffffff" fill-opacity="0.6" text-anchor="end">DEMO PLACEHOLDER · E.ON Mockup</text>
</svg>
