<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Energieatlas">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0E5C4D"/>
      <stop offset="100%" stop-color="#5BA838"/>
    </linearGradient>
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.08"/>
    </pattern>
  </defs>
  <rect width="1280" height="720" fill="url(#g)"/>
  <rect width="1280" height="720" fill="url(#dots)"/>
  <g transform="translate(880, 240)" opacity="0.92">
    
  <path d="M -140 -80 L -50 -100 L 50 -80 L 140 -100 L 140 80 L 50 100 L -50 80 L -140 100 Z" fill="#ffffff" fill-opacity="0.2" stroke="#ffffff" stroke-width="3"/>
  <line x1="-50" y1="-100" x2="-50" y2="80" stroke="#ffffff" stroke-width="2" stroke-dasharray="4 4"/>
  <line x1="50" y1="-80" x2="50" y2="100" stroke="#ffffff" stroke-width="2" stroke-dasharray="4 4"/>
  <!-- Pin -->
  <circle cx="20" cy="-20" r="22" fill="#E2001A"/>
  <path d="M 20 0 L 10 30 L 30 30 Z" fill="#E2001A"/>
  <circle cx="20" cy="-20" r="8" fill="#ffffff"/>

  </g>
  <g transform="translate(80, 460)">
    <rect x="-8" y="-44" width="6" height="120" fill="#E2001A"/>
    <text x="20" y="0" font-family="Helvetica, Arial, sans-serif" font-size="56" font-weight="700" fill="#ffffff">Energieatlas</text>
    <text x="20" y="46" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#ffffff" fill-opacity="0.85">Daten & Karten zur Energiewende</text>
  </g>
  <text x="1240" y="690" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#ffffff" fill-opacity="0.6" text-anchor="end">DEMO PLACEHOLDER · E.ON Mockup</text>
</svg>
