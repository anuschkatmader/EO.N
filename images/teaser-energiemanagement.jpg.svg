<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Energiemanagement">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5C2E91"/>
      <stop offset="100%" stop-color="#8055B0"/>
    </linearGradient>
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.08"/>
    </pattern>
  </defs>
  <rect width="1280" height="720" fill="url(#g)"/>
  <rect width="1280" height="720" fill="url(#dots)"/>
  <g transform="translate(880, 240)" opacity="0.92">
    
  <!-- House outline -->
  <path d="M -120 0 L 0 -120 L 120 0 L 120 100 L -120 100 Z" fill="#ffffff" fill-opacity="0.18"/>
  <path d="M -120 0 L 0 -120 L 120 0" stroke="#ffffff" stroke-width="6" fill="none"/>
  <!-- Wifi arcs -->
  <circle cx="0" cy="-30" r="14" fill="#ffffff"/>
  <path d="M -40 -30 a 40 40 0 0 1 80 0" stroke="#ffffff" stroke-width="6" fill="none"/>
  <path d="M -70 -30 a 70 70 0 0 1 140 0" stroke="#ffffff" stroke-width="6" fill="none" opacity="0.6"/>
  <!-- Door -->
  <rect x="-20" y="40" width="40" height="60" fill="#ffffff" fill-opacity="0.5"/>

  </g>
  <g transform="translate(80, 460)">
    <rect x="-8" y="-44" width="6" height="120" fill="#E2001A"/>
    <text x="20" y="0" font-family="Helvetica, Arial, sans-serif" font-size="56" font-weight="700" fill="#ffffff">Energiemanagement</text>
    <text x="20" y="46" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#ffffff" fill-opacity="0.85">Smart Home von E.ON</text>
  </g>
  <text x="1240" y="690" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#ffffff" fill-opacity="0.6" text-anchor="end">DEMO PLACEHOLDER · E.ON Mockup</text>
</svg>
