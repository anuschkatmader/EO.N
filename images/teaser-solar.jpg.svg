<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid slice" role="img" aria-label="E.ON Solar">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C44A1A"/>
      <stop offset="100%" stop-color="#F08C3A"/>
    </linearGradient>
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.08"/>
    </pattern>
  </defs>
  <rect width="1280" height="720" fill="url(#g)"/>
  <rect width="1280" height="720" fill="url(#dots)"/>
  <g transform="translate(880, 240)" opacity="0.92">
    
  <!-- Sun -->
  <circle cx="-80" cy="-90" r="50" fill="#FFD200"/>
  <g stroke="#FFD200" stroke-width="6" stroke-linecap="round">
    <line x1="-80" y1="-170" x2="-80" y2="-150"/>
    <line x1="-80" y1="-30" x2="-80" y2="-10"/>
    <line x1="-160" y1="-90" x2="-140" y2="-90"/>
    <line x1="-20" y1="-90" x2="0" y2="-90"/>
    <line x1="-138" y1="-148" x2="-124" y2="-134"/>
    <line x1="-36" y1="-46" x2="-22" y2="-32"/>
  </g>
  <!-- Solar panel -->
  <g transform="translate(40, 40) skewX(-20)">
    <rect x="-100" y="-40" width="200" height="100" fill="#1B3D5F"/>
    <line x1="-100" y1="-7" x2="100" y2="-7" stroke="#3E6A92" stroke-width="2"/>
    <line x1="-100" y1="27" x2="100" y2="27" stroke="#3E6A92" stroke-width="2"/>
    <line x1="-33" y1="-40" x2="-33" y2="60" stroke="#3E6A92" stroke-width="2"/>
    <line x1="33" y1="-40" x2="33" y2="60" stroke="#3E6A92" stroke-width="2"/>
  </g>

  </g>
  <g transform="translate(80, 460)">
    <rect x="-8" y="-44" width="6" height="120" fill="#E2001A"/>
    <text x="20" y="0" font-family="Helvetica, Arial, sans-serif" font-size="56" font-weight="700" fill="#ffffff">E.ON Solar</text>
    <text x="20" y="46" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#ffffff" fill-opacity="0.85">Ihre Sonnenenergie vom Dach</text>
  </g>
  <text x="1240" y="690" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#ffffff" fill-opacity="0.6" text-anchor="end">DEMO PLACEHOLDER · E.ON Mockup</text>
</svg>
