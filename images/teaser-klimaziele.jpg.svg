<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Unsere Klimaziele">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2E8B7B"/>
      <stop offset="100%" stop-color="#7DCB5A"/>
    </linearGradient>
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.08"/>
    </pattern>
  </defs>
  <rect width="1280" height="720" fill="url(#g)"/>
  <rect width="1280" height="720" fill="url(#dots)"/>
  <g transform="translate(880, 240)" opacity="0.92">
    
  <circle cx="0" cy="0" r="120" fill="#ffffff" fill-opacity="0.2" stroke="#ffffff" stroke-width="4"/>
  <ellipse cx="0" cy="0" rx="120" ry="50" stroke="#ffffff" stroke-width="3" fill="none"/>
  <ellipse cx="0" cy="0" rx="60" ry="120" stroke="#ffffff" stroke-width="3" fill="none"/>
  <line x1="-120" y1="0" x2="120" y2="0" stroke="#ffffff" stroke-width="3"/>
  <line x1="0" y1="-120" x2="0" y2="120" stroke="#ffffff" stroke-width="3"/>
  <!-- leaf overlay -->
  <path d="M -50 30 C -50 -20, -10 -60, 50 -60 C 50 -20, 0 30, -50 30 Z" fill="#7DCB5A" opacity="0.85"/>

  </g>
  <g transform="translate(80, 460)">
    <rect x="-8" y="-44" width="6" height="120" fill="#E2001A"/>
    <text x="20" y="0" font-family="Helvetica, Arial, sans-serif" font-size="56" font-weight="700" fill="#ffffff">Unsere Klimaziele</text>
    <text x="20" y="46" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#ffffff" fill-opacity="0.85">Auf dem Weg zu Netto-Null</text>
  </g>
  <text x="1240" y="690" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#ffffff" fill-opacity="0.6" text-anchor="end">DEMO PLACEHOLDER · E.ON Mockup</text>
</svg>
