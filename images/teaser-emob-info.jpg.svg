<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid slice" role="img" aria-label="E-Mobilität entdecken">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0E5C4D"/>
      <stop offset="100%" stop-color="#3E92CC"/>
    </linearGradient>
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.08"/>
    </pattern>
  </defs>
  <rect width="1280" height="720" fill="url(#g)"/>
  <rect width="1280" height="720" fill="url(#dots)"/>
  <g transform="translate(880, 240)" opacity="0.92">
    
  <!-- Road perspective -->
  <path d="M -200 200 L -50 -50 L 50 -50 L 200 200 Z" fill="#444"/>
  <path d="M -10 200 L -5 -50 L 5 -50 L 10 200 Z" fill="#FFD200"/>
  <!-- Car from behind -->
  <rect x="-50" y="-20" width="100" height="50" rx="10" fill="#ffffff"/>
  <path d="M -45 -20 L -30 -50 L 30 -50 L 45 -20 Z" fill="#ffffff" fill-opacity="0.85"/>
  <rect x="-30" y="-43" width="60" height="20" fill="#3E92CC" fill-opacity="0.6"/>
  <circle cx="-35" cy="35" r="10" fill="#1a1a1a"/>
  <circle cx="35" cy="35" r="10" fill="#1a1a1a"/>

  </g>
  <g transform="translate(80, 460)">
    <rect x="-8" y="-44" width="6" height="120" fill="#E2001A"/>
    <text x="20" y="0" font-family="Helvetica, Arial, sans-serif" font-size="56" font-weight="700" fill="#ffffff">E-Mobilität entdecken</text>
    <text x="20" y="46" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#ffffff" fill-opacity="0.85">Alles zur E-Auto Förderung</text>
  </g>
  <text x="1240" y="690" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#ffffff" fill-opacity="0.6" text-anchor="end">DEMO PLACEHOLDER · E.ON Mockup</text>
</svg>
